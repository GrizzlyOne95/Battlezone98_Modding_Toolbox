# Release notes, generated by GitHub from the pull requests merged since the
# previous release (the CI workflow's release job asks for them).
changelog:
  exclude:
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels: ["release: major", breaking]
    - title: New features
      labels: ["release: minor", enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
