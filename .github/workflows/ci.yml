name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: windows-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libsndfile1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m bztoolbox help

  build:
    name: Build (${{ matrix.variant }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: full, exclude_gpl: '0', suffix: '' }
          - { variant: mit-only, exclude_gpl: '1', suffix: '-mit' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(tr -d '[:space:]' < VERSION)"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Windows version resource
        run: python packaging/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output build/version_info.txt
      - name: Build with PyInstaller
        env:
          BZTOOLBOX_EXCLUDE_GPL: ${{ matrix.exclude_gpl }}
          BZTOOLBOX_VERSION_FILE: build/version_info.txt
        run: python -m PyInstaller packaging/bztoolbox.spec --noconfirm
      - name: Self-test the frozen build (every page must load)
        run: |
          dist/BZModdingToolbox/bztoolbox.exe --version
          dist/BZModdingToolbox/bztoolbox.exe selftest
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, LICENSING.md dist/BZModdingToolbox/
          Compress-Archive -Path dist/BZModdingToolbox -DestinationPath "BZModdingToolbox-v${{ steps.version.outputs.version }}-windows${{ matrix.suffix }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BZModdingToolbox-windows${{ matrix.suffix }}
          path: BZModdingToolbox-v*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
