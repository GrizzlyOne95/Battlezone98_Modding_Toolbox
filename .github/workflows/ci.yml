name: CI

# Pull requests: tests on Windows, macOS and Linux, plus a build of each
# platform that must pass its self-test. "CI passed" sums these up and is the
# check the main branch requires (.github/rulesets/main.json).
#
# Merges to main run the same jobs on the merge commit and then publish a
# GitHub release: the version comes from scripts/release/next_version.py
# (release: major/minor/patch/skip labels on the merged PR, patch by
# default), the notes from the merged PRs (.github/release.yml), and the
# downloads are attached: Windows setup + portable zip, macOS disk image, Linux
# archive with its install script. The Windows installer and the Linux script
# are installed and uninstalled on every run. "Run workflow" on main releases by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for a manual release from main
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main queue so none is lost mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag, to find the last release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Labels of the pull request
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            labels="$PR_LABELS"
          elif [[ "$EVENT" == "push" ]]; then
            # the PR this merge commit came from (empty for a direct push)
            labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                      --jq '[.[] | select(.merged_at != null)][0].labels[]?.name' || true)"
          fi
          { echo "labels<<EOF"; echo "$labels"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Plan the version
        id: plan
        env:
          LABELS: ${{ steps.labels.outputs.labels }}
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          args=(--labels "$LABELS" --tags "$(git tag -l 'v*')" --head-tags "$(git tag --points-at HEAD)")
          if [[ -n "$BUMP" ]]; then args+=(--bump "$BUMP"); fi
          python scripts/release/next_version.py "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        shell: bash
        run: |
          {
            echo "### Version ${{ steps.plan.outputs.version }}"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "Merging this PR releases **v${{ steps.plan.outputs.version }}** (bump: ${{ steps.plan.outputs.bump }}, release: ${{ steps.plan.outputs.release }})."
              echo "Add a \`release: minor\`, \`release: major\` or \`release: skip\` label to change that."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tk, fontconfig and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fontconfig
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Run tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m bztoolbox help

  build:
    name: Build (${{ matrix.platform }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos }
          # the oldest supported Ubuntu, so the build runs on older glibc too
          - { os: ubuntu-22.04, platform: linux }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fontconfig
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Stamp the version
        shell: bash
        run: printf '%s\n' "$VERSION" > VERSION
      - name: Windows version resource
        if: runner.os == 'Windows'
        run: python packaging/generate_version_info.py --version "${{ env.VERSION }}" --output build/version_info.txt
      - name: Build with PyInstaller
        shell: bash
        env:
          BZTOOLBOX_VERSION_FILE: ${{ runner.os == 'Windows' && 'build/version_info.txt' || '' }}
        run: python -m PyInstaller packaging/bztoolbox.spec --noconfirm
      - name: Self-test the frozen build (every page must load)
        shell: bash
        run: |
          run() { if [[ "$RUNNER_OS" == "Linux" ]]; then xvfb-run -a "$@"; else "$@"; fi; }
          reported="$(dist/BZModdingToolbox/bztoolbox --version)"
          echo "$reported"
          [[ "$reported" == *" $VERSION" ]] || { echo "::error::build reports '$reported', expected $VERSION"; exit 1; }
          run dist/BZModdingToolbox/bztoolbox selftest
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" packaging\windows\BZModdingToolbox.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item "dist\installer\BZModdingToolbox-v$env:VERSION-windows-setup.exe" .
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install for this user, check what Windows sees, then uninstall.
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'BZ Toolbox Install'
          $setup = Start-Process ".\BZModdingToolbox-v$env:VERSION-windows-setup.exe" -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=addtopath,contextmenu', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`""
          if ($setup.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exited with $($setup.ExitCode)" }

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{63CD0930-D3A1-4F9C-9DFE-251D48C601EF}_is1'
          $entry = Get-ItemProperty $key
          $entry | Format-List DisplayName, DisplayVersion, Publisher, InstallLocation, DisplayIcon, UninstallString, URLInfoAbout
          if ($entry.DisplayVersion -ne $env:VERSION) { throw "registered version $($entry.DisplayVersion), expected $env:VERSION" }
          if ($entry.Publisher -ne 'GrizzlyOne95') { throw "publisher is '$($entry.Publisher)'" }
          $appPath = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\BZModdingToolbox.exe').'(default)'
          if (-not (Test-Path $appPath)) { throw "App Paths points at missing $appPath" }
          $userPath = (Get-ItemProperty 'HKCU:\Environment').Path
          if (-not (($userPath -split ';') -contains $dir)) { throw "install folder not on the user PATH: $userPath" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Battlezone Modding Toolbox.lnk")) { throw 'no Start menu shortcut' }
          $menu = 'HKCU:\Software\Classes\Directory\shell\BZModdingToolbox'
          $command = (Get-ItemProperty "$menu\command").'(default)'
          Write-Host "Folder menu: $command"
          if ($command -ne "`"$dir\BZModdingToolbox.exe`" gui --project `"%1`"") { throw "unexpected folder menu command: $command" }
          if (-not (Test-Path 'HKCU:\Software\Classes\Directory\Background\shell\BZModdingToolbox\command')) { throw 'no folder background menu' }

          $reported = & "$dir\bztoolbox.exe" --version
          if ($reported -notlike "* $env:VERSION") { throw "installed build reports '$reported'" }

          # The uninstaller hands off to a temporary copy of itself and returns at once.
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path $key) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $key) { throw 'the uninstall entry is still registered' }
          if (Test-Path "$dir\bztoolbox.exe") { throw 'program files were left behind' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\BZModdingToolbox.exe') { throw 'App Paths entry was left behind' }
          if (Test-Path $menu) { throw 'folder menu entry was left behind' }
          if (Test-Path 'HKCU:\Software\Classes\Directory\Background\shell\BZModdingToolbox') { throw 'folder background menu entry was left behind' }
          if (((Get-ItemProperty 'HKCU:\Environment').Path -split ';') -contains $dir) { throw 'install folder is still on PATH' }
          Write-Host 'Installer and uninstaller behaved.'
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the portable build, for anyone who does not want to install
          Copy-Item README.md, LICENSE, LICENSING.md, THIRD_PARTY_NOTICES.md dist/BZModdingToolbox/
          Compress-Archive -Path dist/BZModdingToolbox -DestinationPath "BZModdingToolbox-v$env:VERSION-windows-portable.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # a disk image with the app and a shortcut to drag it into Applications
          mkdir -p build/dmg
          cp -R dist/BZModdingToolbox.app build/dmg/
          ln -s /Applications build/dmg/Applications
          cp README.md LICENSE LICENSING.md THIRD_PARTY_NOTICES.md build/dmg/
          hdiutil create -volname "Battlezone Modding Toolbox" -srcfolder build/dmg -fs HFS+ \
            -format UDZO -ov "BZModdingToolbox-v$VERSION-macos.dmg"
          hdiutil verify "BZModdingToolbox-v$VERSION-macos.dmg"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp README.md LICENSE LICENSING.md THIRD_PARTY_NOTICES.md dist/BZModdingToolbox/
          cp packaging/linux/install.sh packaging/linux/io.github.grizzlyone95.bzmoddingtoolbox.desktop dist/BZModdingToolbox/
          cp bztoolbox/resources/branding/app_icon.png dist/BZModdingToolbox/io.github.grizzlyone95.bzmoddingtoolbox.png
          chmod +x dist/BZModdingToolbox/install.sh
          tar -C dist -czf "BZModdingToolbox-v$VERSION-linux.tar.gz" BZModdingToolbox
      - name: Test the install script (Linux)
        if: runner.os == 'Linux'
        run: |
          home="$RUNNER_TEMP/home"; mkdir -p "$home/extract"
          tar -C "$home/extract" -xzf "BZModdingToolbox-v$VERSION-linux.tar.gz"
          export HOME="$home"; unset XDG_DATA_HOME
          sh "$home/extract/BZModdingToolbox/install.sh"
          desktop="$home/.local/share/applications/io.github.grizzlyone95.bzmoddingtoolbox.desktop"
          desktop-file-validate "$desktop" 2>/dev/null || true
          grep -q "^Exec=\"$home/.local/share/BZModdingToolbox/BZModdingToolbox\" gui$" "$desktop"
          [[ "$("$home/.local/bin/bztoolbox" --version)" == *" $VERSION" ]]
          "$home/.local/share/BZModdingToolbox/install.sh" --uninstall
          left="$(find "$home" -mindepth 1 -not -type d -not -path "$home/extract/*")"
          [[ -z "$left" ]] || { echo "::error::left behind: $left"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: BZModdingToolbox-${{ matrix.platform }}
          path: BZModdingToolbox-v*
          if-no-files-found: error

  ci-passed:
    name: CI passed
    if: always()
    needs: [version, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  release:
    name: Release
    needs: [version, ci-passed]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release
      issues: write     # create the release labels
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the release labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "release: major" --color B60205 --description "Merging releases a new major version" --force
          gh label create "release: minor" --color FBCA04 --description "Merging releases a new minor version" --force
          gh label create "release: patch" --color 0E8A16 --description "Merging releases a patch version (the default)" --force
          gh label create "release: skip" --color CCCCCC --description "Merging does not release" --force
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Battlezone Modding Toolbox ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: artifacts/BZModdingToolbox-v*
