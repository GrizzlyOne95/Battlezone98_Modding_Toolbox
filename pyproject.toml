[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battlezone-modding-toolbox"
description = "One application for Battlezone 98 Redux modding: missions, worlds, assets, validation, localization and Workshop publishing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GrizzlyOne95" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "Pillow>=10.0",
    "imageio>=2.9",
    "customtkinter>=5.2",
    "soundfile>=0.12",
    "requests>=2.28",
    "keyring>=24",
    "qrcode>=7",
    "deep-translator>=1.11",
    "google-auth>=2.20",
    # live mesh preview; only where ogre-python publishes wheels
    'ogre-python>=14; (sys_platform == "win32" or sys_platform == "linux") and (platform_machine == "AMD64" or platform_machine == "x86_64") and (python_version == "3.10" or python_version == "3.12")',
]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.3"]            # drag & drop in Textures
mesh-preview = ["ogre-python"]        # other platforms: preview if a wheel exists
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
bztoolbox = "bztoolbox.cli:main"

[project.gui-scripts]
bztoolbox-gui = "bztoolbox.app.shell:run"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["battlezone*", "bztoolbox*"]

[tool.setuptools.package-data]
"*" = ["**/*.txt", "**/*.ttf", "**/*.ico", "**/*.png", "**/*.wav", "**/*.material", "**/*.json",
       "**/*.csv", "**/*.ps1", "LICENSE", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
